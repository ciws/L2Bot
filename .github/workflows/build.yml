name: Build check

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout L2Bot
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build native regression checks
        run: |
          cmake -S tests/Native.Tests -B artifacts/native-tests -A Win32
          cmake --build artifacts/native-tests --config Release

      - name: Test native serialization and state
        run: artifacts/native-tests/Release/NativeTests.exe

      - name: Test engine and cross-language pipe protocol
        run: dotnet run --project tests/BotEngine.Tests -c Release -- "${{ github.workspace }}/artifacts/native-tests/Release/NativeTests.exe"

      - name: Build injectable DLL and core (Release Win32)
        run: msbuild L2Bot.sln /p:Configuration=Release /p:Platform=x86 /t:L2BotDll /m

      - name: Build WPF client (Release)
        run: dotnet build Client\Client.csproj -c Release
